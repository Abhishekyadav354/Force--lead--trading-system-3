<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Force-Lead // Prediction Console</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root { --bg:#071016; --panel:#0d1a20; --panel-hi:#12252c; --line:#213a42; --text:#d8ebe5; --muted:#77928f; --green:#53e0a2; --red:#ff737e; --amber:#f5c969; --cyan:#64d9e8; --blue:#83a9ff; --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace; }
    * { box-sizing:border-box; } body { margin:0; color:var(--text); background:radial-gradient(circle at 90% -10%,#15333a 0,#071016 38%),var(--bg); font:13px var(--mono); min-width:320px; }
    body:before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.07; background-image:linear-gradient(rgba(130,220,205,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(130,220,205,.35) 1px,transparent 1px); background-size:32px 32px; mask-image:linear-gradient(to bottom,#000,transparent 80%); }
    #root { position:relative; max-width:1500px; margin:auto; padding:14px; } .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0 15px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; } .mark { width:29px; height:29px; display:grid; place-items:center; border:1px solid var(--green); color:var(--green); font-weight:800; } h1,h2,h3,p { margin:0; } h1 { font-size:15px; letter-spacing:.08em; } h2 { font-size:12px; letter-spacing:.1em; color:var(--cyan); } h3 { font-size:11px; color:var(--muted); font-weight:500; letter-spacing:.08em; text-transform:uppercase; }
    .subtle { color:var(--muted); font-size:11px; } .status { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); padding:5px 8px; color:var(--amber); font-size:10px; letter-spacing:.08em; } .status i { width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 9px currentColor; } .status.ok { color:var(--green); } .status.bad { color:var(--red); }
    .hero { display:grid; gap:10px; margin:14px 0; } .hero-main,.panel { border:1px solid var(--line); background:linear-gradient(145deg,rgba(18,37,44,.96),rgba(10,22,28,.96)); } .hero-main { padding:18px; position:relative; overflow:hidden; } .hero-main:after { content:"PAPER / SIMULATION"; position:absolute; right:-27px; top:15px; transform:rotate(35deg); color:rgba(83,224,162,.16); font-size:10px; letter-spacing:.1em; }
    .hero-title { display:flex; align-items:end; justify-content:space-between; gap:12px; } .symbol { font-size:28px; color:white; font-weight:800; } .price { font-size:25px; font-weight:700; margin-top:13px; } .change.up,.buy { color:var(--green); } .change.down,.sell { color:var(--red); } .signal { display:flex; align-items:center; justify-content:space-between; gap:15px; margin-top:15px; padding-top:14px; border-top:1px solid var(--line); } .signal strong { font-size:24px; letter-spacing:.13em; } .signal small { display:block; color:var(--muted); font-size:10px; margin-top:4px; }
    .score { min-width:105px; } .score-bar,.meter { height:7px; background:#071116; border:1px solid #29434a; overflow:hidden; } .score-bar span,.meter span { display:block; height:100%; background:var(--green); transition:width .3s; } .score-number { margin-top:5px; text-align:right; color:var(--muted); font-size:11px; }
    .grid { display:grid; gap:10px; } .panel { padding:13px; } .section { margin:10px 0; } .section summary { cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px; border:1px solid var(--line); background:rgba(13,26,32,.85); color:var(--text); } .section summary::-webkit-details-marker { display:none; } .section summary:after { content:"+"; color:var(--cyan); font-size:16px; } .section[open] summary:after { content:"-"; } .section-body { border:1px solid var(--line); border-top:0; padding:10px; background:rgba(10,21,27,.72); }
    .metrics { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } .metric { min-width:0; padding:9px; border-left:2px solid #28515b; background:rgba(100,217,232,.035); } .metric label { display:block; color:var(--muted); font-size:10px; text-transform:uppercase; margin-bottom:5px; } .metric b { display:block; color:#f2faf7; font-size:14px; overflow-wrap:anywhere; } .metric b.green { color:var(--green); } .metric b.amber { color:var(--amber); } .metric b.red { color:var(--red); }
    .table { width:100%; border-collapse:collapse; } .table th,.table td { text-align:left; padding:7px 4px; border-bottom:1px solid rgba(33,58,66,.75); font-size:11px; } .table th { color:var(--muted); font-weight:500; } .factor-name { color:var(--text); } .mini-bar { width:70px; height:5px; background:#071116; } .mini-bar span { display:block; height:100%; background:var(--cyan); }
    .graph { display:block; width:100%; height:132px; background:#081419; border:1px solid #18323a; } .graph-wrap { margin-top:8px; } .legend { display:flex; justify-content:space-between; color:var(--muted); font-size:10px; margin-top:5px; } .alert { display:flex; gap:8px; padding:9px; border-left:2px solid var(--cyan); background:rgba(100,217,232,.05); margin-bottom:7px; } .alert.high { border-color:var(--red); } .alert.medium { border-color:var(--amber); } .alert small { color:var(--muted); }
    .empty { padding:18px 6px; color:var(--muted); text-align:center; border:1px dashed var(--line); } .footer { padding:15px 0 4px; color:var(--muted); font-size:10px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; } .pill { color:var(--amber); border:1px solid rgba(245,201,105,.4); padding:3px 6px; font-size:10px; }
    @media(min-width:680px) { #root { padding:18px 24px; } .hero { grid-template-columns:1.45fr .55fr; } .metrics { grid-template-columns:repeat(4,minmax(0,1fr)); } .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; } }
    @media(min-width:1000px) { .grid { grid-template-columns:repeat(12,1fr); align-items:start; } .wide { grid-column:span 8; } .side { grid-column:span 4; } .full { grid-column:span 12; } .section { margin:0; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const {useEffect,useRef,useState} = React;
    const MISSING = "--";
    const n = (value, fallback=null) => { const number = Number(value); return Number.isFinite(number) ? number : fallback; };
    const text = (value, fallback=MISSING) => value === null || value === undefined || value === "" ? fallback : String(value);
    const pct = value => { const number=n(value); return number === null ? MISSING : `${(Math.abs(number) <= 1 ? number*100 : number).toFixed(1)}%`; };
    const money = value => { const number=n(value); return number === null ? MISSING : `₹${number.toLocaleString("en-IN",{maximumFractionDigits:2})}`; };
    const first = (object, paths, fallback=null) => { for (const path of paths) { let value=object; for (const key of path.split(".")) value=value && typeof value === "object" ? value[key] : undefined; if (value !== null && value !== undefined && value !== "") return value; } return fallback; };
    const array = value => Array.isArray(value) ? value : [];
    const clamp = (value,min=0,max=100) => Math.max(min,Math.min(max,n(value,0)));
    const title = value => text(value).replace(/_/g," ").toUpperCase();
    const factorNames = {f1:"Volume force",f2:"Wall force",f3:"Position risk",f4:"Acceleration",f5:"Institutional",f6:"OI signal",f7:"Spread quality",f8:"NIFTY alignment",f9:"Candle conviction"};
    const normalize = raw => { const d=raw && typeof raw === "object" ? raw : {}; const components=d.components||{}; const flow=d.order_flow||components.order_flow||{}; const lead=d.lead_time||d.lead||{}; const leadStatus=lead.status||lead.crossover||d.lead_status||{}; const reversal=d.reversal||{}; const ml=d.ml||d.ml_result||components.ml||{}; const significance=d.significance||d.sig||{}; const mc=d.monte_carlo||d.mc_result||d.monteCarlo||{}; const regime=d.regime||d.market_regime||{}; const move=d.move||d.move_prediction||{}; const factors=d.factors||d.factors_detail||components.factors||{}; const position=d.position||d.position_info||{}; return {d,flow,lead,leadStatus,reversal,ml,significance,mc,regime,move,factors,position}; };
    function CanvasGraph({values=[],color="var(--green)",fill=false,curve=false}) { const ref=useRef(null); useEffect(()=>{ const canvas=ref.current, ctx=canvas.getContext("2d"), ratio=window.devicePixelRatio||1, width=canvas.clientWidth||300, height=132; canvas.width=width*ratio; canvas.height=height*ratio; ctx.scale(ratio,ratio); ctx.clearRect(0,0,width,height); ctx.strokeStyle="#18323a"; ctx.lineWidth=1; for(let y=18;y<height;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(width,y);ctx.stroke();} const nums=values.map(v=>n(v)).filter(v=>v!==null); if(!nums.length)return; const min=Math.min(...nums),max=Math.max(...nums),range=max-min||1; ctx.beginPath(); nums.forEach((value,i)=>{const x=nums.length===1?width/2:i/(nums.length-1)*width; const y=height-12-(value-min)/range*(height-28); i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke(); if(fill){ctx.lineTo(width,height);ctx.lineTo(0,height);ctx.fillStyle="rgba(83,224,162,.10)";ctx.fill();} if(curve&&nums.length>1){ctx.setLineDash([3,4]);ctx.strokeStyle="#f5c969";ctx.beginPath();ctx.moveTo(0,height-26);ctx.lineTo(width*.65,height-42);ctx.lineTo(width,height-76);ctx.stroke();ctx.setLineDash([]);} },[values,color,fill,curve]); return React.createElement("canvas",{className:"graph",ref}); }
    function Metric({label,value,tone=""}) { return <div className="metric"><label>{label}</label><b className={tone}>{text(value)}</b></div>; }
    function Section({title:heading,children,open=false,summary}) { return <details className="section" open={open}><summary><span><h2>{heading}</h2>{summary&&<span className="subtle"> {summary}</span>}</span></summary><div className="section-body">{children}</div></details>; }
    function Progress({value,color="var(--green)"}) { return <div className="meter"><span style={{width:`${clamp(value)}%`,background:color}} /></div>; }
    function App(){ const [raw,setRaw]=useState({}); const [connected,setConnected]=useState(false); const [lastEvent,setLastEvent]=useState(null); const [forceHistory,setForceHistory]=useState([]); const [leadHistory,setLeadHistory]=useState([]); const [sample,setSample]=useState(false); const q=normalize(raw); const d=q.d; const signal=String(first(d,["signal","direction"],"WAIT")).toUpperCase(); const score=n(first(d,["combined_score","score","force_score"],null)); const direction=signal==="BUY"?"UP":signal==="SELL"?"DOWN":signal==="WAIT"?"SIDEWAYS":title(signal); const system=d.system||{}; useEffect(()=>{ if(!window.io)return; const socket=window.io({transports:["websocket","polling"],autoConnect:true}); socket.on("connect",()=>setConnected(true)); socket.on("disconnect",()=>setConnected(false)); socket.on("status",()=>setConnected(true)); socket.on("signal_update",payload=>{ if(payload&&typeof payload==="object"){setRaw(payload);setSample(false);setLastEvent(new Date()); const next=n(first(payload,["force_score","combined_score","score"],null)); if(next!==null)setForceHistory(history=>[...history.slice(-59),next]); const leadValue=n(first(payload,["lead_status.progress_pct","lead_time.status.progress_pct","lead_time.crossover.progress_pct"],null)); if(leadValue!==null)setLeadHistory(history=>[...history.slice(-59),leadValue]); }}); return ()=>socket.disconnect(); },[]);
      const demo=()=>{setSample(true);setRaw({symbol:"NIFTY",price:22418.4,change:86.2,changePct:.39,signal:"BUY",combined_score:.68,confidence:.74,move:{size:"MEDIUM",expected_move_pct:1.2,rupee_move:268,target:22686,duration_minutes:18,candles:4},lead_time:{status:{status:"APPROACHING",progress_pct:64,minutes_remaining:3.2},force_history:[-.12,.08,.21,.35,.48,.68]},reversal:{volume:180000,average_volume:120000,multiple:1.5,opposite_volume_progress:.62,reversal_time:7,probability_curve:[.08,.12,.19,.28,.38,.5]},order_flow:{delta:{delta:18400,cumulative_delta:39200},divergence:{type:"NONE",strength:0},absorption:{type:"NONE",strength:0},exhaustion:{is_exhausted:false,strength:0},vwap:{vwap:22392},volume_profile:{poc:22404},imbalance:.64},factors:{f1:.8,f2:.62,f3:.3,f4:.55,f5:.71,f6:.2,f7:.81,f8:.66,f9:.74},ml:{confidence:.72,win_probability:.73,probabilities:{up:.73,down:.17,sideways:.10},model_outputs:{RF:.74,XGB:.71,GB:.69,LR:.65}},significance:{p_value:.023,z_score:2.28,streak:4},monte_carlo:{win_probability:.71,expected_pnl:127,var:.08,simulations:10000},regime:{market_regime:"TRENDING",hurst:.64,volatility_rank:72},position:{status:"FLAT",quantity:0,entry_price:null,unrealized_pnl:0},alerts:[{level:"MEDIUM",message:"Lead approaching crossover"}],system:{mode:"paper",connected:true,apiOk:true,mlLoaded:true}});setForceHistory([-.12,.08,.21,.35,.48,.68]);setLeadHistory([12,22,29,42,53,64]);};
      const price=n(first(d,["price","ltp","live_price"])); const change=n(d.change); const changePct=n(d.changePct); const move=q.move; const leadProgress=clamp(first(q.leadStatus,["progress_pct","progress","completion_pct"],first(q.lead,["progress_pct"],null))); const flow=q.flow; const delta=flow.delta||{}; const divergence=flow.divergence||{}; const absorption=flow.absorption||{}; const exhaustion=flow.exhaustion||{}; const vwap=flow.vwap||{}; const profile=flow.volume_profile||flow.volumeProfile||{}; const reversalSignal=q.reversal.reversal_signal||{}; const alerts=array(d.alerts); const factorEntries=Object.entries(q.factors).filter(([key])=>/^f[1-9]$/i.test(key));
      return <><header className="topbar"><div className="brand"><div className="mark">FL</div><div><h1>FORCE-LEAD // PREDICTION CONSOLE</h1><div className="subtle">Evidence monitor · no execution controls</div></div></div><div className={`status ${connected?"ok":"bad"}`}><i />{connected?"SOCKET LIVE":"SOCKET OFFLINE"}</div></header><main><div className="hero"><div className="hero-main"><div className="hero-title"><div><div className="subtle">INSTRUMENT</div><div className="symbol">{text(first(d,["symbol","system.symbol"]))}</div></div><div className="subtle">UPDATED<br/><b>{lastEvent?lastEvent.toLocaleTimeString():text(first(d,["timestamp","system.time"]))}</b></div></div><div className="price">{money(price)} <span className={`change ${change>=0?"up":"down"}`}>{change===null?MISSING:`${change>=0?"+":""}${change.toFixed(2)} (${pct(changePct)})`}</span></div><div className="signal"><div><strong className={signal==="BUY"?"buy":signal==="SELL"?"sell":""}>{direction}</strong><small>MODEL DIRECTION · {title(first(d,["signal"],"WAIT"))}</small></div><div className="score"><div className="score-bar"><span style={{width:`${clamp(score===null?50:(score+1)*50)}%`}} /></div><div className="score-number">SCORE {score===null?MISSING:score.toFixed(3)}</div></div></div></div><div className="panel"><h3>MODE / SYSTEM</h3><div style={{marginTop:10}} className="pill">{title(first(system,["mode"],"PAPER"))} / SIMULATION</div><div style={{marginTop:12}} className="subtle">DATA API <b className={system.apiOk?"green":""}>{system.apiOk===undefined?MISSING:system.apiOk?"OK":"CHECK"}</b></div><div className="subtle" style={{marginTop:7}}>ML MODELS <b>{system.mlLoaded===undefined?MISSING:system.mlLoaded?"LOADED":"OFFLINE"}</b></div></div></div>
        <div className="grid"><div className="wide"><Section title="MOVE PROJECTION" open summary="size, target and timing"><div className="metrics"><Metric label="Move size" value={title(move.size)}/><Metric label="Expected move" value={pct(first(move,["expected_move_pct","percent","pct"]))}/><Metric label="Rupee move" value={money(first(move,["rupee_move","expected_move"] ))}/><Metric label="Target" value={money(first(move,["target","target_price"]))}/><Metric label="Duration" value={first(move,["duration_minutes","duration"] )===null?MISSING:`${text(first(move,["duration_minutes","duration"]))} min`}/><Metric label="Candles" value={first(move,["candles","expected_candles"] )===null?MISSING:text(first(move,["candles","expected_candles"]))}/><Metric label="Confidence" value={pct(first(d,["confidence","model_confidence"]))} tone="green"/><Metric label="Combined score" value={score===null?MISSING:score.toFixed(3)} /></div></Section><Section title="LEAD-TIME ENGINE" summary={title(first(q.leadStatus,["status"],"WAIT"))}><div className="metrics"><Metric label="Status" value={title(first(q.leadStatus,["status"],null))} tone="amber"/><Metric label="Progress" value={leadProgress===null?MISSING:`${leadProgress.toFixed(0)}%`}/><Metric label="Minutes left" value={first(q.leadStatus,["minutes_remaining","remaining_minutes"],first(q.lead,["minutes_remaining"],null))===null?MISSING:`${text(first(q.leadStatus,["minutes_remaining","remaining_minutes"],first(q.lead,["minutes_remaining"],null)))} min`}/><Metric label="Lead direction" value={title(first(q.lead,["direction"],null))}/></div><Progress value={leadProgress}/><div className="graph-wrap"><CanvasGraph values={forceHistory.length?forceHistory:first(q.lead,["force_history","history"],[])} fill/><div className="legend"><span>FORCE HISTORY</span><span>{text(first(q.lead,["history_window"],"rolling"))}</span></div></div></Section><Section title="REVERSAL MONITOR" summary={reversalSignal.reversal_starting?"STARTING":"VOLUME / PROBABILITY"}><div className="metrics"><Metric label="Reversal volume" value={first(q.reversal,["volume","reversal_volume"])===null?MISSING:first(q.reversal,["volume","reversal_volume"]).toLocaleString?.("en-IN")||text(first(q.reversal,["volume","reversal_volume"]))}/><Metric label="Average volume" value={first(q.reversal,["average_volume","avg_volume"])===null?MISSING:text(first(q.reversal,["average_volume","avg_volume"]))}/><Metric label="Multiple" value={first(q.reversal,["multiple","volume_multiple"])===null?MISSING:`${text(first(q.reversal,["multiple","volume_multiple"]))}x`}/><Metric label="Opposite volume" value={pct(first(q.reversal,["opposite_volume_progress","opposite_volume_pct"]))}/><Metric label="Reversal time" value={first(q.reversal,["reversal_time","minutes"] )===null?MISSING:`${text(first(q.reversal,["reversal_time","minutes"]))} min`}/><Metric label="Probability" value={pct(first(q.reversal,["probability","reversal_probability"]))} tone="amber"/></div><Progress value={first(q.reversal,["opposite_volume_progress","opposite_volume_pct"],0)*100}/><div className="graph-wrap"><CanvasGraph values={array(first(q.reversal,["probability_curve","probability_history"],[]))} color="var(--amber)" curve/><div className="legend"><span>REVERSAL PROBABILITY CURVE</span><span>heuristic evidence</span></div></div></Section></div>
          <div className="side"><Section title="ORDER FLOW" open><div className="metrics"><Metric label="Delta" value={first(delta,["delta","value"])} tone={n(first(delta,["delta","value"]),0)>=0?"green":"red"}/><Metric label="Cumulative delta" value={first(delta,["cumulative_delta","cumulative"])} /><Metric label="Divergence" value={title(first(divergence,["type","signal"],first(flow,["divergence"],null)))} /><Metric label="Absorption" value={title(first(absorption,["type","signal"],null))}/><Metric label="Exhaustion" value={exhaustion.is_exhausted===undefined?MISSING:exhaustion.is_exhausted?"YES":"NO"}/><Metric label="VWAP" value={money(first(vwap,["vwap","value"]))}/><Metric label="POC" value={money(first(profile,["poc","value"],first(flow,["poc"],null)))}/><Metric label="Imbalance" value={pct(first(flow,["imbalance","imbalance_ratio"]))}/></div></Section><Section title="F1-F9 FACTORS" summary="force decomposition"><table className="table"><thead><tr><th>FACTOR</th><th>VALUE</th><th>BAR</th></tr></thead><tbody>{factorEntries.length?factorEntries.map(([key,value])=><tr key={key}><td className="factor-name">{key.toUpperCase()} {factorNames[key.toLowerCase()]||""}</td><td>{n(value)===null?MISSING:n(value).toFixed(3)}</td><td><div className="mini-bar"><span style={{width:`${clamp((n(value,0)+1)*50)}%`}} /></div></td></tr>):<tr><td colSpan="3" className="subtle">No factor data</td></tr>}</tbody></table></Section></div>
          <div className="wide"><Section title="ML / STATISTICS" open><div className="two"><div><h3>Model outputs</h3><div className="metrics" style={{marginTop:8}}><Metric label="ML confidence" value={pct(first(q.ml,["confidence","model_confidence"]))}/><Metric label="UP probability" value={pct(first(q.ml,["probabilities.up","up_probability","buy_probability"]))} tone="green"/><Metric label="DOWN probability" value={pct(first(q.ml,["probabilities.down","down_probability","sell_probability"]))} tone="red"/><Metric label="SIDEWAYS probability" value={pct(first(q.ml,["probabilities.sideways","sideways_probability"]))}/></div><p className="subtle" style={{marginTop:10}}>Models: {Object.entries(q.ml.model_outputs||q.ml.models||{}).map(([key,value])=>`${key} ${pct(value)}`).join(" · ")||MISSING}</p></div><div><h3>Significance</h3><div className="metrics" style={{marginTop:8}}><Metric label="p-value" value={n(first(q.significance,["p_value","pValue"]))?.toFixed(4)} /><Metric label="z-score" value={n(first(q.significance,["z_score","zScore"]))?.toFixed(3)}/><Metric label="streak" value={first(q.significance,["streak","signal_streak"])===null?MISSING:text(first(q.significance,["streak","signal_streak"]))}/><Metric label="Status" value={first(q.significance,["is_significant","significant"])===undefined?MISSING:first(q.significance,["is_significant","significant"]) ? "SIGNIFICANT":"NOT SIGNIFICANT"} tone="amber"/></div></div></div></Section><Section title="MONTE CARLO / RISK" summary="scenario engine"><div className="metrics"><Metric label="Win probability" value={pct(first(q.mc,["win_probability","winProbability"]))} tone="green"/><Metric label="Expected PnL" value={money(first(q.mc,["expected_pnl","expectedPnL","expected_value"]))}/><Metric label="VaR" value={money(first(q.mc,["var","value_at_risk","VaR"]))} tone="red"/><Metric label="Simulations" value={first(q.mc,["simulations","n_simulations","n"])} /></div></Section></div>
          <div className="side"><Section title="REGIME / POSITION" open><div className="metrics"><Metric label="Market regime" value={title(first(q.regime,["market_regime","regime","name"],first(d,["market_regime"],null)))}/><Metric label="Hurst" value={n(first(q.regime,["hurst","hurst_exponent"]))?.toFixed(3)}/><Metric label="Volatility rank" value={pct(first(q.regime,["volatility_rank","vol_rank"]))}/><Metric label="Position" value={title(first(q.position,["status","side"],null))}/><Metric label="Quantity" value={first(q.position,["quantity","qty"])}/><Metric label="Entry price" value={money(first(q.position,["entry_price","entry"]))}/><Metric label="Unrealized PnL" value={money(first(q.position,["unrealized_pnl","pnl"]))}/></div></Section><Section title="ALERTS / SYSTEM" open><div>{alerts.length?alerts.map((alert,index)=><div className={`alert ${(alert.level||"").toLowerCase()}`} key={index}><span>{title(alert.level||"INFO")}</span><div>{text(alert.message||alert.text)}<br/><small>{text(alert.time||alert.timestamp,"")}</small></div></div>):<div className="empty">No active alerts</div>}</div><div style={{marginTop:10}} className="subtle">FEED: {system.connected===undefined?MISSING:system.connected?"CONNECTED":"DISCONNECTED"} · SOCKET: {connected?"CONNECTED":"DISCONNECTED"}</div></Section></div></div></main><footer className="footer"><span>FORCE-LEAD / evidence only · predictions are estimates, never guarantees</span><span>{sample?"SAMPLE DATA VIEW":"LIVE PAYLOAD VIEW"} · {lastEvent?`last event ${lastEvent.toLocaleTimeString()}`:"waiting for signal_update"}</span></footer>{!Object.keys(raw).length&&<div className="empty" style={{marginTop:10}}>Waiting for backend signal_update. Missing values are shown as --. <button onClick={demo} style={{marginLeft:8,color:"var(--cyan)",background:"transparent",border:"1px solid var(--line)",padding:"5px 8px",font: "inherit",cursor:"pointer"}}>LOAD SAMPLE VIEW</button></div>}</>;
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
