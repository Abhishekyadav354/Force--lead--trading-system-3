const {useEffect,useRef,useState}=React;
const missing=v=>v===null||v===undefined||v===""?"--":String(v);const num=(v,d=null)=>{const n=Number(v);return Number.isFinite(n)?n:d};const pct=v=>{const n=num(v);return n===null?"--":`${(Math.abs(n)<=1?n*100:n).toFixed(1)}%`};const money=v=>{const n=num(v);return n===null?"--":`₹${n.toLocaleString("en-IN",{maximumFractionDigits:2})}`};const get=(o,paths,d=null)=>{for(const path of paths){let v=o;for(const k of path.split("."))v=v&&typeof v==='object'?v[k]:undefined;if(v!==null&&v!==undefined&&v!=="")return v}return d};const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,num(v,0)));const title=v=>missing(v).replaceAll("_"," ").toUpperCase();
function Canvas({values=[],color="#53e0a2",bars=false}){const ref=useRef(null);useEffect(()=>{const c=ref.current,x=c.getContext('2d'),w=c.clientWidth||300,h=140,r=devicePixelRatio||1;c.width=w*r;c.height=h*r;x.scale(r,r);x.clearRect(0,0,w,h);const a=values.map(v=>num(v)).filter(v=>v!==null);if(!a.length)return;x.strokeStyle='#18323a';for(let y=20;y<h;y+=30){x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}if(bars){const max=Math.max(...a,1),bw=w/a.length;x.fillStyle=color;a.forEach((v,i)=>x.fillRect(i*bw,h-12-v/max*(h-28),Math.max(2,bw-3),v/max*(h-28)))}else{const lo=Math.min(...a),range=Math.max(...a)-lo||1;x.beginPath();a.forEach((v,i)=>{const px=a.length<2?w/2:i/(a.length-1)*w,py=h-12-(v-lo)/range*(h-28);i?x.lineTo(px,py):x.moveTo(px,py)});x.strokeStyle=color;x.lineWidth=2;x.stroke()}},[values,color,bars]);return <canvas className="canvas" ref={ref}/>}
function Metric({label,value,tone=''}){return <div className="metric"><label>{label}</label><b className={tone}>{missing(value)}</b></div>};function Section({name,children,open=false}){return <details className="section" open={open}><summary>{name}</summary><div className="section-body">{children}</div></details>};function Meter({value}){return <div className="meter"><span style={{width:`${clamp(value)}%`}}/></div>}
function LiveView({data,onRefresh,sound,setSound}){const [history,setHistory]=useState([]);const [touchY,setTouchY]=useState(null);const d=data||{},flow=d.order_flow||get(d,['components.order_flow'],{}),lead=d.lead_time||{},ls=lead.status||d.lead_status||{},move=d.move||{},rev=d.reversal||{},f=d.factors||d.factors_detail||{},ml=d.ml||d.ml_result||{},sig=d.significance||d.sig||{},mc=d.monte_carlo||d.mc_result||{},reg=d.regime||{},pos=d.position||{};useEffect(()=>{const s=num(get(d,['force_score','combined_score','score']));if(s!==null)setHistory(h=>[...h.slice(-59),s])},[d]);useEffect(()=>{const down=e=>setTouchY(window.scrollY===0?e.touches[0].clientY:null);const up=e=>{if(touchY!==null&&e.changedTouches[0].clientY-touchY>90&&window.scrollY===0)onRefresh()};window.addEventListener('touchstart',down,{passive:true});window.addEventListener('touchend',up,{passive:true});return()=>{window.removeEventListener('touchstart',down);window.removeEventListener('touchend',up)}},[touchY,onRefresh]);const signal=String(get(d,['signal','direction'],'WAIT')).toUpperCase();const score=num(get(d,['combined_score','score','force_score']));const factors=Object.entries(f).filter(([k])=>/^f[1-9]$/i.test(k));return <><div className="hero"><div className="panel"><div className="subtle">INSTRUMENT</div><div className="symbol">{missing(get(d,['symbol','system.symbol']))}</div><div className="price">{money(get(d,['price','ltp']))} <span className={num(d.change,0)>=0?'up':'down'}>{d.change===undefined?'--':`${num(d.change,0)>=0?'+':''}${num(d.change,0).toFixed(2)} (${pct(d.changePct)})`}</span></div><div className="signal"><div><strong className={signal==='BUY'?'buy':signal==='SELL'?'sell':'wait'}>{signal==='BUY'?'UP':signal==='SELL'?'DOWN':'SIDEWAYS'}</strong><div className="subtle">{title(signal)} · updated {missing(get(d,['timestamp','system.time']))}</div></div><div className="score"><div className="bar"><span style={{width:`${clamp(score===null?50:(score+1)*50)}%`}}/></div><small>SCORE {score===null?'--':score.toFixed(3)}</small></div></div></div><div className="panel"><div className="subtle">OPERATING MODE</div><h2 style={{color:'var(--amber)',margin:'10px 0'}}>PAPER / SIMULATION</h2><div className="subtle">FEED {get(d,['system.connected'])===undefined?'--':d.system.connected?'CONNECTED':'DISCONNECTED'} · NO EXECUTION</div><button style={{marginTop:12}} onClick={()=>setSound(!sound)}>SOUND {sound?'ON':'OFF'}</button></div></div><div className="live-grid"><div className="left"><Section name="MOVE / CONFIDENCE" open><div className="metrics"><Metric label="Move size" value={title(move.size)}/><Metric label="Move %" value={pct(get(move,['expected_move_pct','percent']))}/><Metric label="Rupee move" value={money(get(move,['rupee_move','expected_move']))}/><Metric label="Target" value={money(get(move,['target','target_price']))}/><Metric label="Duration" value={get(move,['duration_minutes','duration'])===null?'--':`${get(move,['duration_minutes','duration'])} min`}/><Metric label="Candles" value={get(move,['candles','expected_candles'])}/><Metric label="Confidence" value={pct(get(d,['confidence','model_confidence']))} tone="up"/><Metric label="Combined score" value={score===null?'--':score.toFixed(3)}/></div></Section><Section name="LEAD TIME / FORCE HISTORY"><div className="metrics"><Metric label="Status" value={title(ls.status)} tone="warn"/><Metric label="Progress" value={pct(get(ls,['progress_pct','progress']))}/><Metric label="Minutes left" value={get(ls,['minutes_remaining','remaining_minutes'])===null?'--':`${get(ls,['minutes_remaining','remaining_minutes'])} min`}/><Metric label="Direction" value={title(get(lead,['direction']))}/></div><Meter value={get(ls,['progress_pct','progress'],0)}/><Canvas values={history.length?history:get(lead,['force_history','history'],[])}/><div className="legend"><span>FORCE HISTORY</span><span>rolling window</span></div></Section><Section name="REVERSAL MONITOR"><div className="metrics"><Metric label="Reversal volume <script>
(function () {
	const panel = document.createElement('section');
	panel.id = 'adaptive-lead-panel';
	panel.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:20;width:min(360px,calc(100vw - 28px));padding:12px;background:#050505;border:1px solid #303030;color:#f2f2f2;font:12px "Courier New",monospace;box-shadow:0 8px 30px #000';
	panel.innerHTML = '<div style="display:flex;justify-content:space-between;gap:8px"><strong>ADAPTIVE LEAD WINDOW</strong><strong id="adaptive-state" style="color:#bdbdbd">NORMAL</strong></div><div id="adaptive-estimate-note" style="color:#777;margin:6px 0 10px">Historical/model estimate · not guaranteed</div><div id="adaptive-values" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"></div><div id="adaptive-reliability" style="color:#777;margin-top:10px"></div>';
	document.body.appendChild(panel);
	const state = document.getElementById('adaptive-state');
	const values = document.getElementById('adaptive-values');
	const reliability = document.getElementById('adaptive-reliability');
	const display = value => value === null || value === undefined || value === '' ? '--' : String(value);
	const minutes = value => value === null || value === undefined ? '--' : `${Number(value).toFixed(2)} min`;
	const bars = value => value === null || value === undefined ? '--' : `${Number(value).toFixed(2)} bars`;
	const updateAdaptiveLead = payload => {
		const lead = payload && payload.adaptive_lead_time ? payload.adaptive_lead_time : {};
		const rawState = String(lead.speed_regime || lead.status || 'NORMAL').toUpperCase();
		const stateLabel = rawState.includes('SHOCK') ? 'SHOCK' : rawState === 'ACCELERATING' ? 'ACCELERATING' : 'NORMAL';
		state.textContent = stateLabel;
		state.style.color = stateLabel === 'SHOCK' ? '#ff3344' : stateLabel === 'ACCELERATING' ? '#bdbdbd' : '#00ff66';
		const window = lead.estimated_lead_window_bars || {};
		values.innerHTML = [
			['CURRENT SPEED', lead.current_speed == null ? '--' : `${display(lead.current_speed)}/min`],
			['REQUIRED SPEED', lead.required_speed == null ? '--' : `${display(lead.required_speed)}/min`],
			['NORMAL ETA', minutes(lead.normal_eta_minutes)],
			['FAST ETA', minutes(lead.accelerated_eta_minutes)],
			['SHOCK ETA', minutes(lead.shock_eta_minutes)],
			['LEAD WINDOW', `${minutes(lead.normal_eta_minutes)} / ${bars(window.normal)}`]
		].map(item => `<div><span style="color:#777;display:block">${item[0]}</span><strong>${item[1]}</strong></div>`).join('');
		reliability.textContent = `HISTORICAL SAMPLES ${display(lead.sample_count)} · LOOKBACK ${display(lead.lookback_days)}d · CONFIDENCE ${lead.confidence == null ? '--' : `${(Number(lead.confidence) * 100).toFixed(1)}%`} · ${display(lead.timeframe)}`;
	};
	if (window.io) {
		const adaptiveSocket = window.io();
		adaptiveSocket.on('signal_update', updateAdaptiveLead);
	}
})();
</script></body></html>
